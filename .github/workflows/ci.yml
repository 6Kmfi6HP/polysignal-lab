name: ci
on: [push, pull_request]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra nautilus --extra dev --frozen

      - name: Validate commit messages
        if: |
          github.event_name == 'pull_request' ||
          (github.event_name == 'push' &&
           github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
           github.event.before != '0000000000000000000000000000000000000000')
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            uv run python scripts/validate_commit_msg.py \
              --range "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          else
            uv run python scripts/validate_commit_msg.py \
              --head "${{ github.sha }}" \
              --before "${{ github.event.before }}" \
              --default-branch "origin/${{ github.event.repository.default_branch }}"
          fi

      - name: Run pre-commit
        run: uv run pre-commit run --all-files --hook-stage pre-commit

      - name: Run pytest with Nautilus required
        env:
          NAUTILUS_REQUIRED: "1"
        run: uv run pytest

      - name: basedpyright (no new errors vs baseline)
        run: uv run basedpyright

      - name: Safety scan
        run: uv run polysignal-safety-scan .

  frontend:
    runs-on: [self-hosted, Linux, X64]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
