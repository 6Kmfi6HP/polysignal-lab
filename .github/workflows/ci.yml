name: ci
on: [push, pull_request]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra nautilus --extra dev --frozen

      - name: Validate commit messages
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            range="${{ github.event.before }}..${{ github.sha }}"
          else
            first="$(git rev-list --max-parents=0 "$GITHUB_SHA")"
            range="${first}..${GITHUB_SHA}"
          fi
          uv run python scripts/validate_commit_msg.py --range "$range"

      - name: Run pre-commit
        run: uv run pre-commit run --all-files --hook-stage pre-commit

      - name: Run pytest with Nautilus required
        env:
          NAUTILUS_REQUIRED: "1"
        run: uv run pytest

      - name: basedpyright (no new errors vs baseline)
        run: uv run basedpyright

      - name: Safety scan
        run: uv run polysignal-safety-scan .

  frontend:
    runs-on: [self-hosted, Linux, X64]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
