name: ci
on: [push, pull_request]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra nautilus --extra dev --frozen

      - name: Validate commit messages
        if: |
          github.event_name == 'pull_request' ||
          (github.event_name == 'push' &&
           (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) ||
            startsWith(github.ref, 'refs/heads/debug/')) &&
           github.event.before != '0000000000000000000000000000000000000000')
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            uv run python scripts/validate_commit_msg.py \
              --range "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          else
            uv run python scripts/validate_commit_msg.py \
              --head "${{ github.sha }}" \
              --before "${{ github.event.before }}" \
              --default-branch "origin/${{ github.event.repository.default_branch }}"
          fi

      - name: Run pre-commit
        run: uv run pre-commit run --all-files --hook-stage pre-commit

      - name: Run pytest with Nautilus required
        env:
          NAUTILUS_REQUIRED: "1"
        run: uv run pytest

      - name: Nautilus manifest drift check
        run: uv run python scripts/verify_nautilus_manifest_drift.py

      - name: basedpyright (no new errors vs baseline)
        run: uv run basedpyright

      - name: Safety scan
        run: uv run polysignal-safety-scan .

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test

  image:
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' ||
       startsWith(github.ref, 'refs/heads/debug/'))
    needs: [test, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Extract Nautilus manifest labels
        id: manifest
        run: |
          python3 - <<'PY'
          import json
          import os

          manifest = json.load(
              open("docs/runtime_verification/nautilus-polysignal-wheel.json", encoding="utf-8")
          )
          source_sha = manifest.get("source_commit_sha") or manifest["patch_commit_sha"]
          values = {
              "upstream_sha": manifest["upstream_base_sha"],
              "patch_sha": source_sha,
              "release_tag": manifest["release_tag"],
              "version": manifest["version"],
              "wheel_sha256": manifest["wheel_sha256"],
          }
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              for key, value in values.items():
                  output.write(f"{key}={value}\n")
          PY

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.0.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Plan image version
        id: version
        env:
          SOURCE_REF: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
        run: >-
          python3 scripts/image_version.py build
          --ref-name "$SOURCE_REF"
          --source-sha "$SOURCE_SHA"
          --run-number "$RUN_NUMBER"
          --github-output "$GITHUB_OUTPUT"

      - name: Build and push image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          target: nautilus-runtime
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.version.outputs.immutable_tag }}
            ${{ steps.image.outputs.name }}:${{ steps.version.outputs.moving_tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.base_version }}
            org.opencontainers.image.ref.name=${{ steps.version.outputs.source_ref }}
            io.polysignal.build.channel=${{ steps.version.outputs.channel }}
            io.polysignal.build.version=${{ steps.version.outputs.build_version }}
            io.polysignal.nautilus.upstream-sha=${{ steps.manifest.outputs.upstream_sha }}
            io.polysignal.nautilus.patch-sha=${{ steps.manifest.outputs.patch_sha }}
            io.polysignal.nautilus.release-tag=${{ steps.manifest.outputs.release_tag }}
            io.polysignal.nautilus.version=${{ steps.manifest.outputs.version }}
            io.polysignal.nautilus.wheel-sha256=${{ steps.manifest.outputs.wheel_sha256 }}

      - name: Attest image provenance
        uses: actions/attest-build-provenance@8beda2b7ed98355c0e97c0a63bec38ae472e66c4 # v4.1.0
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
