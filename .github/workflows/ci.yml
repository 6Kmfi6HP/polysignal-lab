name: ci
on: [push, pull_request]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra nautilus --extra dev --refresh

      - name: Validate commit messages
        if: |
          github.event_name == 'pull_request' ||
          (github.event_name == 'push' &&
           (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) ||
            startsWith(github.ref, 'refs/heads/debug/')) &&
           github.event.before != '0000000000000000000000000000000000000000')
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            uv run python scripts/validate_commit_msg.py \
              --range "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          else
            uv run python scripts/validate_commit_msg.py \
              --head "${{ github.sha }}" \
              --before "${{ github.event.before }}" \
              --default-branch "origin/${{ github.event.repository.default_branch }}"
          fi

      - name: Run pre-commit
        run: uv run pre-commit run --all-files --hook-stage pre-commit

      - name: Run pytest with Nautilus required
        env:
          NAUTILUS_REQUIRED: "1"
        run: uv run pytest

      - name: Record resolved Nautilus version
        run: |
          uv run python -c 'import importlib.metadata; print("nautilus-trader", importlib.metadata.version("nautilus-trader"))'

      - name: basedpyright (no new errors vs baseline)
        run: uv run basedpyright

      - name: Safety scan
        run: uv run polysignal-safety-scan .

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test

  image:
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' ||
       startsWith(github.ref, 'refs/heads/debug/'))
    needs: [test, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.0.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Plan image version
        id: version
        env:
          SOURCE_REF: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
        run: >-
          python3 scripts/image_version.py build
          --ref-name "$SOURCE_REF"
          --source-sha "$SOURCE_SHA"
          --run-number "$RUN_NUMBER"
          --manifest-output build-info.json
          --github-output "$GITHUB_OUTPUT"

      - name: Build and push image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          target: nautilus-runtime
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.version.outputs.immutable_tag }}
            ${{ steps.image.outputs.name }}:${{ steps.version.outputs.moving_tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.version.outputs.commit_sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.application_version }}
            org.opencontainers.image.ref.name=${{ steps.version.outputs.source_ref }}
            io.polysignal.build.channel=${{ steps.version.outputs.channel }}
            io.polysignal.build.version=${{ steps.version.outputs.build_version }}

      - name: Install crane
        uses: imjasonh/setup-crane@31b88efe9de28ae0ffa220711af4b60be9435f6e # v0.4
        with:
          version: v0.21.9

      - name: Verify embedded build info matches OCI labels
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          config="$(crane config "${IMAGE}@${DIGEST}")"
          embedded="$(crane export "${IMAGE}@${DIGEST}" - | tar -xO app/build-info.json)"
          python3 - "$config" "$embedded" <<'PY'
          import json
          import sys

          labels = json.loads(sys.argv[1])["config"]["Labels"]
          embedded = json.loads(sys.argv[2])
          expected = {
              "application_version": labels["org.opencontainers.image.version"],
              "build_version": labels["io.polysignal.build.version"],
              "channel": labels["io.polysignal.build.channel"],
              "source_ref": labels["org.opencontainers.image.ref.name"],
              "commit_sha": labels["org.opencontainers.image.revision"],
          }
          mismatches = [
              f"{key}: embedded={embedded.get(key)!r} label={value!r}"
              for key, value in expected.items()
              if embedded.get(key) != value
          ]
          if mismatches:
              raise SystemExit("label/build info mismatch: " + "; ".join(mismatches))
          print("embedded build info matches OCI labels")

      - name: Attest image provenance
        uses: actions/attest-build-provenance@8beda2b7ed98355c0e97c0a63bec38ae472e66c4 # v4.1.0
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
