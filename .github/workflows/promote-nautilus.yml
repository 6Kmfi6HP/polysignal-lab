name: promote-nautilus

"on":
  workflow_dispatch:
    inputs:
      source:
        description: >-
          official-nightly resolves a nightly wheel from the Nautech index by
          version; wheel-url accepts any immutable wheel URL with a SHA-256.
        required: true
        default: official-nightly
        type: choice
        options:
          - official-nightly
          - wheel-url
      wheel_version:
        description: >-
          Official nightly version for source=official-nightly, e.g.
          1.231.0a20260802. Ignored for source=wheel-url.
        required: false
        type: string
      wheel_url:
        description: >-
          Direct immutable wheel URL for source=wheel-url.
        required: false
        type: string
      wheel_sha256:
        description: >-
          SHA-256 digest for source=wheel-url. Required for wheel-url.
        required: false
        type: string
      release_tag:
        description: >-
          Release tag/channel label, e.g. nightly, v1.230.0, or
          polysignal-1.231.0a20260802.1. Required for wheel-url.
        required: false
        type: string
      source_repository:
        description: >-
          Nautilus source repository, e.g. nautechsystems/nautilus_trader or a
          fork repository.
        required: false
        default: nautechsystems/nautilus_trader
        type: string
      source_ref:
        description: >-
          Nautilus source ref, e.g. nightly, develop, or a release tag.
        required: false
        type: string
      source_commit_sha:
        description: >-
          Full source commit SHA for source=wheel-url. Required for wheel-url.
        required: false
        type: string
      upstream_base_sha:
        description: >-
          Upstream base SHA for patched/fork wheels. Optional; when blank the
          existing manifest value is preserved.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: promote-nautilus
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.12"

      - name: Verify and resolve wheel
        id: verify-wheel
        env:
          SOURCE: ${{ inputs.source }}
          WHEEL_VERSION: ${{ inputs.wheel_version }}
          WHEEL_URL: ${{ inputs.wheel_url }}
          WHEEL_SHA256: ${{ inputs.wheel_sha256 }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_REPOSITORY: ${{ inputs.source_repository }}
          SOURCE_REF: ${{ inputs.source_ref }}
          SOURCE_COMMIT_SHA: ${{ inputs.source_commit_sha }}
          UPSTREAM_BASE_SHA: ${{ inputs.upstream_base_sha }}
        run: |
          set -euo pipefail
          if [ "$SOURCE" = "official-nightly" ]; then
            test -n "$WHEEL_VERSION"
            if ! grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+a[0-9]{8}$' <<<"$WHEEL_VERSION"; then
              echo "refusing: version $WHEEL_VERSION is not a nightly aYYYYMMDD release" >&2
              exit 1
            fi
            wheel_filename="nautilus_trader-${WHEEL_VERSION}-cp312-cp312-manylinux_2_35_x86_64.whl"
            wheel_url="https://packages.nautechsystems.io/simple/nautilus-trader/${wheel_filename}"
            page="$(curl -fsSL https://packages.nautechsystems.io/simple/nautilus-trader/index.html)"
            sha256="$(grep -oP 'nautilus_trader-\Q'${WHEEL_VERSION}'\E-cp312-cp312-manylinux_2_35_x86_64\.whl#sha256=\K[0-9a-f]{64}' <<<"$page" | head -1)"
            if [ -z "$sha256" ]; then
              echo "refusing: $WHEEL_VERSION not found on the official Nautech index" >&2
              exit 1
            fi
            curl -fsSL "$wheel_url" -o wheel.whl
            printf '%s  wheel.whl\n' "$sha256" | sha256sum --check -
            release_tag="${RELEASE_TAG:-nightly}"
            source_ref="${SOURCE_REF:-nightly}"
            source_sha="$(gh api 'repos/nautechsystems/nautilus_trader/commits?sha=nightly&per_page=1' --jq '.[0].sha')"
            source_kind="official-nightly"
            source_repository="${SOURCE_REPOSITORY:-nautechsystems/nautilus_trader}"
            release_url="https://packages.nautechsystems.io/simple/nautilus-trader/"
            upstream_base_sha="${UPSTREAM_BASE_SHA:-}"
          elif [ "$SOURCE" = "wheel-url" ]; then
            test -n "$WHEEL_URL"
            test -n "$WHEEL_SHA256"
            test -n "$RELEASE_TAG"
            test -n "$SOURCE_COMMIT_SHA"
            case "$WHEEL_URL" in
              *\#*)
                echo "refusing: wheel URL must not already contain a fragment" >&2
                exit 1
                ;;
            esac
            if ! grep -Eq '^[0-9a-f]{40}$' <<<"$SOURCE_COMMIT_SHA"; then
              echo "refusing: source_commit_sha must be a 40-character commit SHA" >&2
              exit 1
            fi
            curl -fsSL "$WHEEL_URL" -o wheel.whl
            printf '%s  wheel.whl\n' "$WHEEL_SHA256" | sha256sum --check -
            wheel_filename="$(python3 - "$WHEEL_URL" <<'PY'
          from urllib.parse import unquote, urlsplit
          import sys
          print(unquote(urlsplit(sys.argv[1]).path.rsplit('/', 1)[-1]))
          PY
          )"
            case "$wheel_filename" in
              *.whl) ;;
              *)
                echo "refusing: wheel URL does not end in .whl" >&2
                exit 1
                ;;
            esac
            wheel_url="$WHEEL_URL"
            sha256="$WHEEL_SHA256"
            release_tag="$RELEASE_TAG"
            source_ref="${SOURCE_REF:?source_ref is required for source=wheel-url}"
            source_sha="$SOURCE_COMMIT_SHA"
            source_repository="$SOURCE_REPOSITORY"
            if [ "$source_repository" != "nautechsystems/nautilus_trader" ]; then
              source_kind="fork-release"
            else
              source_kind="custom"
            fi
            upstream_base_sha="${UPSTREAM_BASE_SHA:-}"
            release_url="$(python3 - "$WHEEL_URL" <<'PY'
          import sys
          from urllib.parse import urlsplit
          url = urlsplit(sys.argv[1])
          print(f"{url.scheme}://{url.netloc}{url.path.rsplit('/', 1)[0]}")
          PY
          )"
          else
            echo "refusing: unknown source $SOURCE" >&2
            exit 1
          fi

          version="$(python3 - "$wheel_filename" <<'PY'
          import re
          import sys
          match = re.fullmatch(
              r"nautilus_trader-(?P<version>.+)-(?P<abi>cp\d+)-(?P<abi2>cp\d+)-(?P<platform>.+)\.whl",
              sys.argv[1],
          )
          if not match:
              raise SystemExit(f"cannot parse wheel filename {sys.argv[1]}")
          print(match.group("version"))
          PY
          )"
          {
            echo "wheel_url=$wheel_url"
            echo "wheel_filename=$wheel_filename"
            echo "wheel_sha256=$sha256"
            echo "wheel_version=$version"
            echo "release_tag=$release_tag"
            echo "source_kind=$source_kind"
            echo "source_repository=$source_repository"
            echo "source_ref=$source_ref"
            echo "source_commit_sha=$source_sha"
            echo "release_url=$release_url"
            echo "upstream_base_sha=$upstream_base_sha"
          } >> "$GITHUB_OUTPUT"

      - name: Promote wheel into repo
        env:
          SOURCE: ${{ inputs.source }}
          WHEEL_URL: ${{ steps.verify-wheel.outputs.wheel_url }}
          WHEEL_FILENAME: ${{ steps.verify-wheel.outputs.wheel_filename }}
          WHEEL_SHA256: ${{ steps.verify-wheel.outputs.wheel_sha256 }}
          WHEEL_VERSION: ${{ steps.verify-wheel.outputs.wheel_version }}
          RELEASE_TAG: ${{ steps.verify-wheel.outputs.release_tag }}
          SOURCE_KIND: ${{ steps.verify-wheel.outputs.source_kind }}
          SOURCE_REPOSITORY: ${{ steps.verify-wheel.outputs.source_repository }}
          SOURCE_REF: ${{ steps.verify-wheel.outputs.source_ref }}
          SOURCE_COMMIT_SHA: ${{ steps.verify-wheel.outputs.source_commit_sha }}
          RELEASE_URL: ${{ steps.verify-wheel.outputs.release_url }}
          UPSTREAM_BASE_SHA: ${{ steps.verify-wheel.outputs.upstream_base_sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess

          manifest_path = Path("docs/runtime_verification/nautilus-polysignal-wheel.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          upstream_base_sha = (
              os.environ["UPSTREAM_BASE_SHA"]
              or manifest.get("upstream_base_sha", "")
          )
          manifest.update({
              "schema_version": 1,
              "source_kind": os.environ["SOURCE_KIND"],
              "repository": os.environ["SOURCE_REPOSITORY"],
              "source_ref": os.environ["SOURCE_REF"],
              "version": os.environ["WHEEL_VERSION"],
              "source_commit_sha": os.environ["SOURCE_COMMIT_SHA"],
              "patch_commit_sha": os.environ["SOURCE_COMMIT_SHA"],
              "upstream_base_sha": upstream_base_sha,
              "release_tag": os.environ["RELEASE_TAG"],
              "release_url": os.environ["RELEASE_URL"],
              "wheel_url": os.environ["WHEEL_URL"],
              "wheel_filename": os.environ["WHEEL_FILENAME"],
              "wheel_sha256": os.environ["WHEEL_SHA256"],
              "build_command": f"promote-nautilus workflow: {os.environ['SOURCE']}",
              "verification_command": "uv run python scripts/verify_nautilus_manifest_drift.py",
          })
          manifest["toolchain"] = manifest.get("toolchain", {})
          manifest["toolchain"].update({
              "source_branch": os.environ["SOURCE_REF"],
              "channel": os.environ["SOURCE_KIND"],
          })
          if os.environ["SOURCE"] != "official-nightly":
              manifest.pop("upstream_pr", None)
          manifest_path.write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          subprocess.run(
              ["python3", "scripts/sync_nautilus_wheel.py", "sync"],
              check=True,
          )
          PY

      - name: Regenerate lockfile
        run: uv lock

      - name: Drift check
        run: uv run python scripts/verify_nautilus_manifest_drift.py

      - name: Frozen install and tests
        env:
          NAUTILUS_REQUIRED: "1"
        run: |
          uv sync --extra nautilus --extra dev --frozen
          uv run pytest

      - name: Open promotion PR
        env:
          GH_TOKEN: ${{ github.token }}
          PROMOTION_TAG: ${{ steps.verify-wheel.outputs.release_tag }}
          SOURCE: ${{ inputs.source }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git switch -c "promote-nautilus-${PROMOTION_TAG}"
          git add docs/runtime_verification/nautilus-polysignal-wheel.json \
                  pyproject.toml uv.lock Dockerfile requirements/nautilus.txt \
                  scripts/sync_nautilus_wheel.py \
                  scripts/verify_nautilus_manifest_drift.py
          if git diff --cached --quiet; then
            echo "No provenance changes to promote; nothing to do."
            exit 0
          fi
          git commit -m "chore(nautilus): promote ${PROMOTION_TAG}"
          git push origin "promote-nautilus-${PROMOTION_TAG}"
          gh pr create \
            --base main \
            --head "promote-nautilus-${PROMOTION_TAG}" \
            --title "chore(nautilus): promote ${PROMOTION_TAG}" \
            --body "Promotes the verified immutable wheel ${PROMOTION_TAG} via source=${SOURCE}. CI must confirm the manifest, pyproject.toml, uv.lock, requirements/nautilus.txt and Docker labels all agree before merge."
