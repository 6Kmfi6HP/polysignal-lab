app:
  name: PolySignal Lab
  environment: lab
  mode: signal_plus_paper
  timezone: Asia/Bangkok
  log_level: INFO

safety:
  allow_secret_key_material: false
  allow_secure_polymarket_client: false
  allow_live_market_actions: false
  allow_position_redemption: false
  fail_on_disallowed_env_keys: true

telegram:
  enabled: true
  bot_token_env: TELEGRAM_BOT_TOKEN
  channel_id_env: TELEGRAM_CHANNEL_ID
  parse_mode: HTML
  send_signals: true
  send_consensus_signals: true
  send_paper_results: true
  send_daily_report: true
  max_message_chars: 4096
  retry_attempts: 3
  dry_run: true

markets:
  assets: [BTC, ETH, SOL, XRP]
  timeframes: [5m, 15m]
  refresh_interval_sec: 10
  active_only: true
  closed: false
  cache_ttl_sec: 30

data:
  polymarket:
    gamma_base_url: https://gamma-api.polymarket.com
    clob_base_url: https://clob.polymarket.com
    market_ws_url: wss://ws-subscriptions-clob.polymarket.com/ws/market
    use_market_ws: true
    rest_rate_limit_per_sec: 8.0
    max_book_staleness_ms: 60000
    max_market_metadata_staleness_ms: 10000
    settlement:
      chain_enabled: true
      polygon_rpc_url: ""
      chain_timeout_sec: 3.0
      gamma_enabled: true
      ws_enabled: true
      prefer_chain: true
  binance:
    enabled: true
    base_ws_url: wss://stream.binance.com:9443/stream
    symbols:
      BTC: BTCUSDT
      ETH: ETHUSDT
      SOL: SOLUSDT
      XRP: XRPUSDT
    streams: [aggTrade, bookTicker]
    max_price_staleness_ms: 60000
    reconnect_before_hours: 23

signal:
  min_confidence_to_publish: 0.50
  dedupe_enabled: true
  dedupe_ttl_sec: 300
  consensus_enabled: true
  consensus_window_sec: 45
  max_signals_per_market: 3
  max_signals_per_hour: 60

paper_trading:
  enabled: true
  starting_balance_usdc: 1000.0
  stake_mode: fixed
  fixed_stake_usdc: 10.0
  max_open_positions: 10
  max_market_exposure_usdc: 30.0
  max_strategy_exposure_usdc: 100.0
  fill_model:
    type: best_ask_taker
    slippage_bps: 25
    require_depth_check: true
    min_fill_ratio: 1.0
    reject_if_partial: true
    max_fill_delay_ms: 1000
  exit_model:
    mode: hold_to_resolution_with_optional_tp_sl
    take_profit_enabled: true
    stop_loss_enabled: true
    take_profit_price: 0.90
    stop_loss_price: 0.35
    max_hold_time_sec: 900

storage:
  sqlite_enabled: true
  sqlite_path: data/polysignal_lab.sqlite3
  jsonl_enabled: true
  jsonl_dir: logs
  state_dir: state

dashboard:
  enabled: true
  host: 0.0.0.0
  port: 8080
  read_only: true

strategies:
  vwap_momentum:
    enabled: true
    assets: [BTC]
    timeframes: [5m, 15m]
    min_price: 0.35
    max_price: 0.85
    vwap_window_sec: 30
    momentum_window_sec: 60
    min_deviation_pct: 0.015
    max_deviation_pct: 1.0
    min_momentum: 0.01
    min_z_score: 1.2
    min_elapsed_sec: 45
    no_entry_before_end_sec: 20
    max_spread: 0.03
    max_orderbook_staleness_ms: 60000
  late_consensus:
    enabled: true
    assets: [BTC, ETH, SOL, XRP]
    timeframes: [5m, 15m]
    # Step 1: Entry window (last 240 seconds)
    entry_window_sec: 240
    # Step 2: Entry frequency (min 7s between entries)
    entry_frequency_sec: 7
    # Step 3: Spread = ask_sum (up_ask + down_ask)
    max_ask_sum: 1.05
    # Step 4: Confidence = |up_ask - down_ask|
    min_confidence_abs: 0.30
    # Step 6: Price ceiling
    max_entry_price: 0.92
    # Step 7: Max investment per market
    max_investment_per_market: 300.0
    # Step 8: Dynamic position sizing (contracts)
    sizing_above_180: 8
    sizing_above_120: 10
    sizing_below_120: 12
    # Flip guard: prevent rapid side flips
    flip_guard_enabled: true
    flip_guard_window_sec: 20
    # Flip stop: exit when price drops below threshold
    flip_stop_enabled: true
    flip_stop_price: 0.48
    # Per-coin stop loss
    stop_loss_per_coin:
      BTC: {type: fixed, value: -12.0}
      ETH: {type: fixed, value: -12.0}
      SOL: {type: fixed, value: -12.0}
      XRP: {type: fixed, value: -11.0}
  ptb_diff:
    enabled: true
    assets: [BTC]
    timeframes: [5m, 15m]
    require_verified_ptb_source: true
    max_spread: 0.08
    triggers:
      - name: strong_up_late
        side: UP
        min_diff_usd: 80
        max_token_price: 0.78
        min_probability_edge: 0.08
        min_seconds_to_close: 30
        max_seconds_to_close: 180
      - name: strong_down_late
        side: DOWN
        min_diff_usd: 80
        max_token_price: 0.78
        min_probability_edge: 0.08
        min_seconds_to_close: 30
        max_seconds_to_close: 180
    exit_config:
      stop_loss_prob_pct: 0.20
      take_profit_rr: 3.0
      take_profit_cap: 0.95
      market_data_max_lag_sec: 2
  binary_momentum:
    enabled: true
  cross_market_bot:
    enabled: true
  dump_hedge:
    enabled: true
  fibonacci_bot:
    enabled: true
  low_side_dual_reversion:
    enabled: true
  mid_price_sizing:
    enabled: true
  ninety_nine_cent_sniper:
    enabled: true
  one_cent_buy:
    enabled: true
  pre_order_market:
    enabled: true
  skew_mean_reversion:
    enabled: true

runtime:
  engine: nautilus
  nautilus:
    trader_id: PolySignal-Nautilus-001
    python: "3.12"
    execution_mode: paper_sandbox
    allow_live_polymarket_execution: false
    polymarket_data:
      enabled: true
      ws_max_subscriptions_per_connection: 200
    sidecar:
      spot_source: polymarket_rtds
      price_to_beat_source: anchor_or_gamma
    decision_policy:
      preserve_gate_first_failure_order: true
      consensus_enabled: true
      arbiter_policy: suppress_ambiguous
    market_rotation:
      enabled: true
      interval_sec: 10
      include_next_periods: 1
      stale_grace_sec: 5
      unsubscribe_exited: true
      allow_adapter_new_market_events: false
