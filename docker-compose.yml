# version: "3.9"

services:
  polysignal-lab:
    build:
      context: .
      dockerfile: Dockerfile
      target: nautilus-runtime
    container_name: polysignal-lab
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Override YAML config via environment (read by pydantic-settings)
      POLYSIGNAL_LAB__TELEGRAM__DRY_RUN: "false"
      POLYSIGNAL_LAB__TELEGRAM__ENABLED: "true"
      POLYSIGNAL_LAB__TELEGRAM__SEND_SIGNALS: "true"
      POLYSIGNAL_LAB__TELEGRAM__SEND_CONSENSUS_SIGNALS: "true"
      POLYSIGNAL_LAB__TELEGRAM__SEND_PAPER_RESULTS: "true"
      POLYSIGNAL_LAB__TELEGRAM__SEND_DAILY_REPORT: "true"
      POLYSIGNAL_LAB__APP__TIMEZONE: "${TZ:-Asia/Bangkok}"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./state:/app/state
      - ./config:/app/config:ro
    command: ["nautilus"]
    healthcheck:
      test: ["CMD", "python", "-m", "polysignal_lab.healthcheck", "liveness", "--config", "config/signal_bot.yaml"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 180s

  dashboard-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: polysignal-lab-dashboard-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POLYSIGNAL_LAB__TELEGRAM__DRY_RUN: "true"
      POLYSIGNAL_LAB__DASHBOARD__HOST: "0.0.0.0"
      POLYSIGNAL_LAB__DASHBOARD__PORT: "8080"
    volumes:
      - ./data:/app/data:ro
      - ./logs:/app/logs:ro
      - ./state:/app/state:ro
      - ./config:/app/config:ro
    command: ["dashboard"]
    depends_on:
      polysignal-lab:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  dashboard-web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: polysignal-lab-dashboard-web
    restart: unless-stopped
    ports:
      - "0.0.0.0:8081:80"
    depends_on:
      dashboard-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:80"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
