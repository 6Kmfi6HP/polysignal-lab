# version: "3.9"

services:
  # Cloudflare WARP sidecar. The trading runtime below joins this container's
  # network namespace (network_mode: service:warp), so ALL of its egress
  # (Polymarket REST/WS, Binance WS, Telegram) exits through the WARP tunnel.
  # Verified on this host on 2026-08-10: warp=on, MASQUE, Connected.
  warp:
    image: caomingjun/warp:2026.6.880.0-2.12.0
    container_name: polysignal-lab-warp
    restart: unless-stopped
    # runc PR#3468: containerd >= 1.7.24 (this host: 1.7.24 / runc 1.2.2)
    # removed tun/tap from the default device cgroup rules, which fails
    # warp-svc with "open tun: Operation not permitted" unless re-added.
    device_cgroup_rules:
      - 'c 10:200 rwm'
    cap_add:
      - NET_ADMIN
      - MKNOD
      - AUDIT_WRITE
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=0
      - net.ipv4.conf.all.src_valid_mark=1
    environment:
      - WARP_SLEEP=2
      # Optional WARP+ license key; leave unset for free WARP.
      - WARP_LICENSE_KEY=${WARP_LICENSE_KEY:-}
    volumes:
      # Persist the WARP device registration so restarts don't re-register.
      - ./state/warp:/var/lib/cloudflare-warp
    healthcheck:
      # Only "healthy" once the tunnel actually exits via Cloudflare.
      test: ["CMD-SHELL", "curl -fsS https://www.cloudflare.com/cdn-cgi/trace | grep -qE 'warp=(on|plus)' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    # watchtower runs on this host; keep the pinned WARP client from being
    # auto-recreated (a recreation would briefly drop the tunnel).
    labels:
      - com.centurylinklabs.watchtower.enable=false

  polysignal-lab:
    image: ${POLYSIGNAL_IMAGE_REF:-ghcr.io/6kmfi6hp/polysignal-lab:main}
    container_name: polysignal-lab
    # Tip into the WARP tunnel: share the warp sidecar's network namespace so
    # every outbound socket (including the Rust pyo3 WebSocket client, which
    # ignores HTTP/SOCKS proxy env vars) transparently egresses via WARP.
    network_mode: "service:warp"
    depends_on:
      warp:
        condition: service_healthy
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Self-sufficient market rotation in the strategy heartbeat (ntlm 1.231
      # actor timers do not fire under poll()). Explicit opt-in so unit tests
      # and probe strategies never run Gamma discovery from the event loop.
      POLYSIGNAL_MARKET_DISCOVERY: "1"
      # Override YAML config via environment (read by pydantic-settings)
      POLYSIGNAL_LAB__TELEGRAM__DRY_RUN: "false"
      POLYSIGNAL_LAB__TELEGRAM__ENABLED: "true"
      POLYSIGNAL_LAB__TELEGRAM__SEND_SIGNALS: "true"
      POLYSIGNAL_LAB__TELEGRAM__SEND_CONSENSUS_SIGNALS: "true"
      POLYSIGNAL_LAB__TELEGRAM__SEND_REPORT_RESULTS: "true"
      POLYSIGNAL_LAB__TELEGRAM__SEND_DAILY_REPORT: "true"
      POLYSIGNAL_LAB__APP__TIMEZONE: "${TZ:-Asia/Bangkok}"
      # Where external alpha cores are read from when the safety gate is opened
      # Mounting the directory is inert on its own; loading additionally requires
      # POLYSIGNAL_LAB__SAFETY__ALLOW_EXTERNAL_STRATEGIES=true plus a
      # strategies.external block, neither of which is enabled here
      # See strategies/README.md before opting in, external code runs in-process.
      POLYSIGNAL_STRATEGY_ROOT: "/app/strategies"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./state:/app/state
      - ./archive:/app/archive
      - ./config:/app/config:ro
      - ./strategies:/app/strategies:ro
    command: ["nautilus"]
    # Default 10m x 3 held under two days of a six-day run; the failure window
    # had rotated away before anyone looked. Files under ./logs/runtime are the
    # durable copy, this is the live view.
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "python", "-m", "polysignal_lab.healthcheck", "liveness", "--config", "config/signal_bot.yaml"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 180s

  dashboard-api:
    image: ${POLYSIGNAL_IMAGE_REF:-ghcr.io/6kmfi6hp/polysignal-lab:main}
    container_name: polysignal-lab-dashboard-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POLYSIGNAL_LAB__TELEGRAM__DRY_RUN: "true"
      POLYSIGNAL_LAB__DASHBOARD__HOST: "0.0.0.0"
      POLYSIGNAL_LAB__DASHBOARD__PORT: "8080"
      # Kept identical to the nautilus service so both resolve the same plugin
      # paths when the gate is opened; the dashboard never executes plugins.
      POLYSIGNAL_STRATEGY_ROOT: "/app/strategies"
    volumes:
      - ./data:/app/data:ro
      - ./logs:/app/logs:ro
      - ./state:/app/state:ro
      - ./archive:/app/archive:ro
      - ./config:/app/config:ro
      - ./strategies:/app/strategies:ro
    command: ["dashboard"]
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    depends_on:
      polysignal-lab:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  dashboard-web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: polysignal-lab-dashboard-web
    restart: unless-stopped
    ports:
      - "0.0.0.0:8091:80"
    depends_on:
      dashboard-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:80"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
