server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    resolver 127.0.0.11 ipv6=off valid=30s;
    set $dashboard_api http://dashboard-api:8080;

    location /api/ {
        proxy_pass $dashboard_api$request_uri;
        proxy_set_header Host $host;
    }

    location /health {
        proxy_pass $dashboard_api$request_uri;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
