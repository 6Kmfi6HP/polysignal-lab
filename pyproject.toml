[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "polysignal-lab"
version = "1.0.0"
description = "Read-only Polymarket short-cycle signal and paper trading validation system"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "PolySignal Lab" }]
dependencies = [
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "PyYAML>=6.0",
  "httpx>=0.27",
  "anyio>=4.0",
  "fastapi>=0.111",
  "uvicorn>=0.30",
  "py-clob-client-v2>=0.1.0",
  "python-telegram-bot[rate-limiter]>=22.5",
  "nautilus_trader[polymarket] @ https://github.com/6Kmfi6HP/nautilus_trader/releases/download/polysignal-1.231.0a20260730.1/nautilus_trader-1.231.0a20260730%2Bpolysignal.1-cp312-cp312-manylinux_2_36_x86_64.whl#sha256=6fde27a2f4ed14b1e6a11c38c8a066aaca139afd02e47a1afc7719171109e55c",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pre-commit>=4.6.0",
  "httpx2>=2.4",
  "basedpyright>=1.39.8",
  "ruff>=0.15.18",
  "ast_grep_cli>=0.44.0",
  "hypothesis>=6.0",
]
nautilus = [
  "nautilus_trader[polymarket] @ https://github.com/6Kmfi6HP/nautilus_trader/releases/download/polysignal-1.231.0a20260730.1/nautilus_trader-1.231.0a20260730%2Bpolysignal.1-cp312-cp312-manylinux_2_36_x86_64.whl#sha256=6fde27a2f4ed14b1e6a11c38c8a066aaca139afd02e47a1afc7719171109e55c",
]
[project.scripts]
polysignal-lab = "polysignal_lab.app.main:main"
polysignal-safety-scan = "polysignal_lab.observability.safety:main"
polysignal-telegram-qa = "polysignal_lab.publish.telegram_qa:main"
polysignal-nautilus = "polysignal_lab.nautilus_runtime.node:main"
polysignal-promotion = "polysignal_lab.promotion.cli:main"


[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.hatch.metadata]
allow-direct-references = true

[[tool.uv.index]]
name = "nautechsystems"
url = "https://packages.nautechsystems.io/simple"
explicit = true

[tool.basedpyright]
include = ["src", "tests"]
pythonVersion = "3.12"
failOnWarnings = false
reportMissingTypeStubs = false
# Known debt snapshot (pyo3 stubs + test fakes). Gate is "no new errors":
#   basedpyright                 # must exit 0
#   basedpyright --writebaseline # only when intentionally accepting new debt
baselineFile = ".basedpyright/baseline.json"
executionEnvironments = [
    { root = "src", extraPaths = ["src"] },
    { root = "tests", extraPaths = ["src"] },
]

[tool.hatch.build.targets.wheel]
packages = ["src/polysignal_lab"]

[dependency-groups]
dev = [
    "ast_grep_cli>=0.44.0",
    "basedpyright>=1.39.8",
    "pre-commit>=4.6.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.15.18",
    "hypothesis>=6.0",
]
