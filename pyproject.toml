[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "polysignal-lab"
version = "1.0.0"
description = "Read-only Polymarket short-cycle signal and paper trading validation system"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "PolySignal Lab" }]
dependencies = [
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "PyYAML>=6.0",
  "httpx>=0.27",
  "websockets>=12.0",
  "anyio>=4.0",
  "fastapi>=0.111",
  "uvicorn>=0.30",
  "py-clob-client-v2>=0.1.0"
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "pre-commit>=4.6.0"]

[project.scripts]
polysignal-lab = "polysignal_lab.app.main:main"
polysignal-safety-scan = "polysignal_lab.observability.safety:main"
polysignal-telegram-qa = "polysignal_lab.publish.telegram_qa:main"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["src/polysignal_lab"]

[dependency-groups]
dev = [
    "basedpyright>=1.39.8",
    "pre-commit>=4.6.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.15.18",
]
